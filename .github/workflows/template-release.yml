name: Template release

on:
  push:
    tags: ['aeroframe-v1.0.1']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: template-registry-publication
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: TEMPLATE_VERSION=1.0.1 node --test test/image.test.mjs
      - run: node scripts/validate.mjs templates/aeroframe/${GITHUB_REF_NAME#aeroframe-v}/template.json
        if: startsWith(github.ref, 'refs/tags/aeroframe-v')
      - run: npm run validate
        if: ${{ !startsWith(github.ref, 'refs/tags/aeroframe-v') }}
      - run: npm ci
        working-directory: templates/aeroframe/1.0.1/storefront
      - run: npm test
        working-directory: templates/aeroframe/1.0.1/storefront
      - run: npm run build
        working-directory: templates/aeroframe/1.0.1/storefront

  publish:
    if: startsWith(github.ref, 'refs/tags/aeroframe-v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - uses: actions/checkout@v4
        with:
          ref: registry
          path: registry
      - id: registry
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: node scripts/check-release-registry.mjs
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tagged
        if: steps.registry.outputs.digest == ''
        env:
          IMAGE_TAG: ghcr.io/tangtianshuo/independent-website-templates/aeroframe:${{ github.ref_name }}
        run: |
          if docker pull "$IMAGE_TAG"; then
            reference=$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE_TAG")
            echo "digest=${reference##*@}" >> "$GITHUB_OUTPUT"
          fi
      - id: image
        if: steps.registry.outputs.digest == '' && steps.tagged.outputs.digest == ''
        uses: docker/build-push-action@v6
        with:
          context: templates/aeroframe/1.0.1/
          file: templates/aeroframe/1.0.1/Dockerfile
          push: true
          tags: ghcr.io/tangtianshuo/independent-website-templates/aeroframe:${{ github.ref_name }}
      - uses: actions/attest-build-provenance@v2
        if: steps.registry.outputs.digest == '' && steps.tagged.outputs.digest == ''
        with:
          subject-name: ghcr.io/tangtianshuo/independent-website-templates/aeroframe
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Verify provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ steps.registry.outputs.digest || steps.tagged.outputs.digest || steps.image.outputs.digest }}
          SOURCE_COMMIT: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
        run: gh attestation verify "oci://ghcr.io/tangtianshuo/independent-website-templates/aeroframe@${DIGEST}" -R tangtianshuo/Independent-Website-Templates --source-ref "$SOURCE_REF" --source-digest "$SOURCE_COMMIT" --signer-workflow tangtianshuo/Independent-Website-Templates/.github/workflows/template-release.yml
      - name: Confirm anonymous image access
        env:
          DIGEST: ${{ steps.registry.outputs.digest || steps.tagged.outputs.digest || steps.image.outputs.digest }}
        run: |
          docker logout ghcr.io
          for attempt in $(seq 1 60); do
            if docker pull "ghcr.io/tangtianshuo/independent-website-templates/aeroframe@${DIGEST}"; then
              exit 0
            fi
            echo "Anonymous pull unavailable; make the GHCR package public in GitHub Packages. Retrying in 30 seconds (${attempt}/60)."
            sleep 30
          done
          exit 1
      - name: Smoke test candidate image
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          TEMPLATE_VERSION: '1.0.1'
          RELEASE_IMAGE: ghcr.io/tangtianshuo/independent-website-templates/aeroframe@${{ steps.registry.outputs.digest || steps.tagged.outputs.digest || steps.image.outputs.digest }}
        run: node --test test/image.test.mjs
      - name: Append immutable registry record
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_DIGEST: ${{ steps.registry.outputs.digest || steps.tagged.outputs.digest || steps.image.outputs.digest }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: node scripts/release-registry.mjs
