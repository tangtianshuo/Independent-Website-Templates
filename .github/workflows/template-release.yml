name: Template verification (no publication)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run validate
      - run: npm ci
        working-directory: templates/aeroframe/1.0.0/storefront
      - run: npm test
        working-directory: templates/aeroframe/1.0.0/storefront
      - run: npm run build
        working-directory: templates/aeroframe/1.0.0/storefront
