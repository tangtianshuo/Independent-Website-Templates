name: Template release

on:
  push:
    branches: [master, 'release/v*']
    tags: ['aeroframe-v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: template-registry-publication
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      template_id: ${{ steps.release.outputs.template_id }}
      version: ${{ steps.release.outputs.version }}
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - id: release
        run: python3 .github/scripts/release.py

  verify:
    needs: metadata
    runs-on: ubuntu-latest
    env:
      TEMPLATE_ID: ${{ needs.metadata.outputs.template_id }}
      TEMPLATE_VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Validate selected manifest
        env:
          TEMPLATE_VERSION: ${{ needs.metadata.outputs.version }}
        run: node scripts/validate.mjs "templates/${{ needs.metadata.outputs.template_id }}/${TEMPLATE_VERSION}/template.json"
      - name: Smoke test locally built template image
        env:
          TEMPLATE_VERSION: ${{ needs.metadata.outputs.version }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: node --test test/image.test.mjs
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: templates/${{ needs.metadata.outputs.template_id }}/${{ needs.metadata.outputs.version }}/storefront/package-lock.json
      - run: npm ci
        working-directory: templates/${{ needs.metadata.outputs.template_id }}/${{ needs.metadata.outputs.version }}/storefront
      - run: npm test
        working-directory: templates/${{ needs.metadata.outputs.template_id }}/${{ needs.metadata.outputs.version }}/storefront
      - run: npm run build
        working-directory: templates/${{ needs.metadata.outputs.template_id }}/${{ needs.metadata.outputs.version }}/storefront
      - name: Exercise selected renderer and private preview
        run: npm run test:runtime

  publish:
    if: needs.metadata.outputs.publish == 'true'
    needs: [metadata, verify]
    environment: production
    runs-on: ubuntu-latest
    env:
      TEMPLATE_ID: ${{ needs.metadata.outputs.template_id }}
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: registry
          path: registry
      - id: registry
        env:
          TEMPLATE_VERSION: ${{ needs.metadata.outputs.version }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: node scripts/check-release-registry.mjs
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tagged
        if: steps.registry.outputs.digest == ''
        env:
          IMAGE_TAG: ghcr.io/tangtianshuo/independent-website-templates/${{ needs.metadata.outputs.template_id }}:${{ needs.metadata.outputs.template_id }}-v${{ needs.metadata.outputs.version }}
        run: |
          if docker pull "$IMAGE_TAG"; then
            reference=$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE_TAG")
            echo "digest=${reference##*@}" >> "$GITHUB_OUTPUT"
          fi
      - id: image
        if: steps.registry.outputs.digest == '' && steps.tagged.outputs.digest == ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: templates/${{ needs.metadata.outputs.template_id }}/${{ needs.metadata.outputs.version }}/
          file: templates/${{ needs.metadata.outputs.template_id }}/${{ needs.metadata.outputs.version }}/Dockerfile
          push: true
          tags: ghcr.io/tangtianshuo/independent-website-templates/${{ needs.metadata.outputs.template_id }}:${{ needs.metadata.outputs.template_id }}-v${{ needs.metadata.outputs.version }}
          build-args: |
            SOURCE_COMMIT=${{ github.sha }}
            RELEASE_VERSION=${{ needs.metadata.outputs.version }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        if: steps.registry.outputs.digest == '' && steps.tagged.outputs.digest == ''
        with:
          subject-name: ghcr.io/tangtianshuo/independent-website-templates/${{ needs.metadata.outputs.template_id }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Verify provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ steps.registry.outputs.digest || steps.tagged.outputs.digest || steps.image.outputs.digest }}
          SOURCE_COMMIT: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
        run: gh attestation verify "oci://ghcr.io/tangtianshuo/independent-website-templates/${{ needs.metadata.outputs.template_id }}@${DIGEST}" -R tangtianshuo/Independent-Website-Templates --source-ref "$SOURCE_REF" --source-digest "$SOURCE_COMMIT" --signer-workflow tangtianshuo/Independent-Website-Templates/.github/workflows/template-release.yml
      - name: Confirm anonymous image access
        env:
          DIGEST: ${{ steps.registry.outputs.digest || steps.tagged.outputs.digest || steps.image.outputs.digest }}
        run: |
          docker logout ghcr.io
          for attempt in $(seq 1 60); do
            if docker pull "ghcr.io/tangtianshuo/independent-website-templates/${{ needs.metadata.outputs.template_id }}@${DIGEST}"; then
              exit 0
            fi
            echo "Anonymous pull unavailable; make the GHCR package public in GitHub Packages. Retrying in 30 seconds (${attempt}/60)."
            sleep 30
          done
          exit 1
      - name: Smoke test candidate image
        env:
          TEMPLATE_VERSION: ${{ needs.metadata.outputs.version }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          SOURCE_COMMIT: ${{ github.sha }}
          RELEASE_IMAGE: ghcr.io/tangtianshuo/independent-website-templates/${{ needs.metadata.outputs.template_id }}@${{ steps.registry.outputs.digest || steps.tagged.outputs.digest || steps.image.outputs.digest }}
        run: node --test test/image.test.mjs
      - name: Append immutable registry record
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TEMPLATE_VERSION: ${{ needs.metadata.outputs.version }}
          IMAGE_DIGEST: ${{ steps.registry.outputs.digest || steps.tagged.outputs.digest || steps.image.outputs.digest }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: node scripts/release-registry.mjs
      - name: Synchronize released template image to server
        if: needs.metadata.outputs.template_id == 'aeroframe'
        env:
          IMAGE_DIGEST: ${{ steps.registry.outputs.digest || steps.tagged.outputs.digest || steps.image.outputs.digest }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/deploy.sh
