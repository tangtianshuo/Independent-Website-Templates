name: Preview bundle release

on:
  workflow_dispatch:
    inputs:
      template_id:
        description: Template ID
        required: true
        type: string
      version:
        description: Exact template version
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: template-registry-publication
  cancel-in-progress: false

jobs:
  publish-preview:
    runs-on: ubuntu-latest
    environment: production
    env:
      TEMPLATE_ID: ${{ inputs.template_id }}
      TEMPLATE_VERSION: ${{ inputs.version }}
      SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Validate preview release target
        shell: bash
        run: |
          [[ "$TEMPLATE_ID" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]]
          [[ "$TEMPLATE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test -f "templates/${TEMPLATE_ID}/${TEMPLATE_VERSION}/template.json"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/validate.mjs "templates/${TEMPLATE_ID}/${TEMPLATE_VERSION}/template.json"
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: registry
          path: registry
      - name: Resolve, verify or publish immutable preview bundle
        id: preview
        env:
          REQUIRE_RELEASED_IMAGE: '1'
          NUXT_PUBLIC_PREVIEW_ADMIN_ORIGIN: ${{ vars.CMS_ORIGIN }}
        run: node scripts/preview-publication.mjs
      - name: Append immutable preview registry record
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          PREVIEW_BUNDLE_DIGEST: ${{ steps.preview.outputs.bundle_digest }}
          PREVIEW_ARTIFACT_DIGEST: ${{ steps.preview.outputs.artifact_digest }}
          PREVIEW_ADAPTER_VERSION: ${{ steps.preview.outputs.adapter_version }}
        run: node scripts/preview-release-registry.mjs
