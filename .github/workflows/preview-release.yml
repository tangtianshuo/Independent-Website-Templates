name: Preview bundle release

on:
  workflow_dispatch:
    inputs:
      template_id:
        description: Template ID
        required: true
        type: string
      version:
        description: Exact template version
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  publish-preview:
    runs-on: ubuntu-latest
    environment: production
    env:
      TEMPLATE_ID: ${{ inputs.template_id }}
      TEMPLATE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Validate preview release target
        shell: bash
        run: |
          [[ "$TEMPLATE_ID" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]]
          [[ "$TEMPLATE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test -f "templates/${TEMPLATE_ID}/${TEMPLATE_VERSION}/template.json"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/validate.mjs "templates/${TEMPLATE_ID}/${TEMPLATE_VERSION}/template.json"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: templates/${{ inputs.template_id }}/${{ inputs.version }}/storefront/package-lock.json
      - run: npm ci
        working-directory: templates/${{ inputs.template_id }}/${{ inputs.version }}/storefront
      - run: npm test
        working-directory: templates/${{ inputs.template_id }}/${{ inputs.version }}/storefront
      - name: Build static preview
        id: static
        env:
          PREVIEW_APP_BASE_URL: /preview/${{ inputs.template_id }}/${{ inputs.version }}/
          NUXT_PUBLIC_PREVIEW_ADMIN_ORIGIN: ${{ vars.CMS_ORIGIN }}
        run: |
          npm run build:preview
          rm -rf "$RUNNER_TEMP/preview-bundle"
          node ../../../../scripts/preview-bundle.mjs \
            --public-dir .output/public \
            --output-dir "$RUNNER_TEMP/preview-bundle" \
            --template-id "$TEMPLATE_ID" \
            --template-version "$TEMPLATE_VERSION"
          echo "bundle_digest=$(node -p "require('$RUNNER_TEMP/preview-bundle/preview-bundle.json').bundleDigest")" >> "$GITHUB_OUTPUT"
        working-directory: templates/${{ inputs.template_id }}/${{ inputs.version }}/storefront
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: bundle
        shell: bash
        run: |
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -czf "$RUNNER_TEMP/preview-bundle.tar.gz" -C "$RUNNER_TEMP/preview-bundle" .
          repository="ghcr.io/tangtianshuo/independent-website-preview-bundles/${TEMPLATE_ID}"
          reference="${repository}:${TEMPLATE_ID}-v${TEMPLATE_VERSION}"
          docker run --rm -v "$RUNNER_TEMP:/workspace" ghcr.io/oras-project/oras:v1.2.3 \
            push "$reference" /workspace/preview-bundle.tar.gz \
            --artifact-type application/vnd.bcms.preview.bundle.v1 \
            --format '{{.digest}}' > "$RUNNER_TEMP/digest.txt"
          echo "artifact_digest=$(cat "$RUNNER_TEMP/digest.txt")" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: registry
          path: registry
      - name: Append immutable preview registry record
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          PREVIEW_BUNDLE_DIGEST: ${{ steps.static.outputs.bundle_digest }}
          PREVIEW_ARTIFACT_DIGEST: ${{ steps.bundle.outputs.artifact_digest }}
          PREVIEW_ADAPTER_VERSION: '1'
        run: node scripts/preview-release-registry.mjs
